# PLICA – Produktion
#   cp .env.example .env   (Werte setzen!)
#   docker compose up -d
#   docker compose logs app | grep Einrichtungscode
# Optional mit Virenscanner: docker compose --profile clamav up -d  (und CLAMAV_HOST=clamav in .env)
name: plica

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  init: true
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

x-app-env: &app-env
  env_file:
    - path: ${PLICA_ENV_FILE:-.env}
      required: true
  environment:
    DATABASE_URL: postgres://${POSTGRES_USER:-plica}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in .env}@db:5432/${POSTGRES_DB:-plica}
    S3_ENDPOINT: http://storage:9000
    S3_ACCESS_KEY: ${S3_ROOT_USER:?S3_ROOT_USER fehlt in .env}
    S3_SECRET_KEY: ${S3_ROOT_PASSWORD:?S3_ROOT_PASSWORD fehlt in .env}
    S3_FORCE_PATH_STYLE: "true"
    APP_URL: ${APP_URL:?APP_URL fehlt in .env}
    SECRET_KEY: ${SECRET_KEY:?SECRET_KEY fehlt in .env}

services:
  migrate:
    <<: [*hardening, *app-env]
    image: ${PLICA_IMAGE:-plica:local}
    build: .
    restart: "no"
    command: ["node", "dist/migrate.mjs"]
    mem_limit: 256m
    pids_limit: 100
    networks: [internal]
    depends_on:
      db: { condition: service_healthy }

  app:
    <<: [*hardening, *app-env]
    image: ${PLICA_IMAGE:-plica:local}
    build: .
    ports: ["${PLICA_BIND:-127.0.0.1}:${PLICA_PORT:-3000}:3000"]
    tmpfs: ["/tmp:size=64m", "/app/.next/cache:size=64m,uid=1000,gid=1000"]
    volumes: ["backups:/backups"]
    mem_limit: 768m
    pids_limit: 200
    networks: [internal, web]
    depends_on:
      migrate: { condition: service_completed_successfully }
      storage: { condition: service_healthy }

  worker:
    <<: [*hardening, *app-env]
    image: ${PLICA_IMAGE:-plica:local}
    command: ["node", "dist/worker.mjs"]
    tmpfs: ["/tmp:size=128m"]
    volumes: ["backups:/backups"]
    mem_limit: 512m
    pids_limit: 200
    # Webhooks und SMTP brauchen ausgehende Verbindungen
    networks: [internal, web]
    healthcheck:
      disable: true
    depends_on:
      migrate: { condition: service_completed_successfully }
      storage: { condition: service_healthy }

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plica}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in .env}
      POSTGRES_DB: ${POSTGRES_DB:-plica}
    volumes: ["db:/var/lib/postgresql"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    shm_size: 128m
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 30
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # S3-kompatibler Objektspeicher (RustFS, Apache-2.0). MinIO-Images werden
  # seit 2025 nicht mehr öffentlich verteilt; jeder S3-Dienst funktioniert.
  storage:
    image: ${STORAGE_IMAGE:-rustfs/rustfs:1.0.3}
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ROOT_USER:?S3_ROOT_USER fehlt in .env}
      RUSTFS_SECRET_KEY: ${S3_ROOT_PASSWORD:?S3_ROOT_PASSWORD fehlt in .env}
      RUSTFS_VOLUMES: /data
      RUSTFS_CONSOLE_ENABLE: "false"
    volumes: ["files:/data"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    networks: [internal]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      retries: 30
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  clamav:
    profiles: [clamav]
    # Debian-Variante: amd64 und arm64 (das Alpine-Image gibt es nur für amd64)
    image: ${CLAMAV_IMAGE:-clamav/clamav-debian:stable}
    restart: unless-stopped
    mem_limit: 3g
    networks: [internal]
    volumes: ["clamav:/var/lib/clamav"]

networks:
  # Datenbank, Objektspeicher und Virenscanner sind von außen nicht erreichbar.
  internal:
    internal: true
  web: {}

volumes:
  db:
  files:
  backups:
  clamav:
