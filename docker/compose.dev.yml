# Nur für die lokale Entwicklung. Alle Ports auf 127.0.0.1.
name: plica-dev
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: plica
      POSTGRES_PASSWORD: plica-dev-only
      POSTGRES_DB: plica
    ports: ["127.0.0.1:4732:5432"]
    volumes: [db:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plica -d plica"]
      interval: 3s
      retries: 20
  # S3-kompatibler Speicher (wie in Produktion). Konsole: http://127.0.0.1:4791
  storage:
    image: rustfs/rustfs:1.0.3
    environment:
      RUSTFS_ACCESS_KEY: plica-dev
      RUSTFS_SECRET_KEY: plica-dev-only-secret
      RUSTFS_VOLUMES: /data
    ports: ["127.0.0.1:4790:9000", "127.0.0.1:4791:9001"]
    volumes: [rustfs:/data]
  mailpit:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:4725:1025", "127.0.0.1:4780:8025"]
volumes:
  db:
  rustfs:
