# Nur für die lokale Entwicklung. Alle Ports auf 127.0.0.1.
name: plica-dev
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: plica
      POSTGRES_PASSWORD: plica-dev-only
      POSTGRES_DB: plica
    ports: ["127.0.0.1:4732:5432"]
    volumes: [db:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plica -d plica"]
      interval: 3s
      retries: 20
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: plica-dev
      MINIO_ROOT_PASSWORD: plica-dev-only-secret
    ports: ["127.0.0.1:4790:9000", "127.0.0.1:4791:9001"]
    volumes: [minio:/data]
  mailpit:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:4725:1025", "127.0.0.1:4780:8025"]
volumes:
  db:
  minio:
